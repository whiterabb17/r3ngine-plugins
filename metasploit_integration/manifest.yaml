name: "Metasploit Integration"
description: "Standalone Metasploit integration providing a 2-way interactive terminal and automated Temporal-driven template scans."
version: "1.0.0"
slug: "metasploit_integration"
author: "MistrHyde"
icon: "icon.png"

runtime:
  run after: "standalone"

temporal:
  workflows:
    - "backend.temporal_exports.MetasploitTaskWorkflow"
  activities:
    - "backend.temporal_exports.generate_rc_script_activity"
    - "backend.temporal_exports.run_msfconsole_activity"
    - "backend.temporal_exports.parse_and_save_findings_activity"
    - "backend.temporal_exports.finalize_task_activity"

ui:
  entry: "ui/dist"
  menu_item: "Metasploit"
  menu_path: "/p/metasploit"
  entry_export: "MetasploitPluginApp"
