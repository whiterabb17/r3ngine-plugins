name: "Compliance Assessment"
version: "1.1.0"
author: "MistrHyde"
icon: "icon.svg"
description: "Post-scan compliance analysis mapping scan artefacts to PCI-DSS, HIPAA, NIST, CIS, ISO 27001, and SOC 2 controls."
runtime:
  run after: "tier_7"
temporal:
  workflows:
    - "backend.temporal_exports.ComplianceAssessmentWorkflow"
  activities:
    - "backend.temporal_exports.run_compliance_assessment_activity"
ui:
  menu_item: "Compliance"
  menu_path: "/p/compliance-assessment"
  entry_export: "ComplianceDashboardPage"

mcp:
  tools:
    - r3ngine_list_compliance_assessments
    - r3ngine_get_compliance_assessment
    - r3ngine_list_compliance_controls
    - r3ngine_get_compliance_report
    - r3ngine_enrich_compliance_control
